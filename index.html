<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能磨豆機</title>
<style>
  :root {
    --bg:#0a0e14; --panel:#12171f; --border:#1e2733; --text:#dde1e8; --muted:#6b7280;
    --accent:#3b82f6; --green:#10b981; --red:#ef4444; --orange:#f59e0b; --cyan:#06b6d4;
    --radius:10px; --gap:14px;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--bg); color:var(--text); min-height:100dvh;
    -webkit-text-size-adjust:100%;
    display:flex; flex-direction:column; align-items:center; padding:14px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px; width:100%; max-width:460px; }
  h1 { font-size:1.45rem; text-align:center; margin-bottom:3px; }
  .sub { text-align:center; font-size:0.9rem; color:var(--muted); margin-bottom:14px; }

  /* ── standby ── */
  .sb { display:flex; align-items:center; gap:10px; margin-bottom:14px; padding:12px;
    background:rgba(59,130,246,0.05); border-radius:8px; border:1px solid var(--border); }
  .sb.low { background:rgba(239,68,68,0.06); border-color:rgba(239,68,68,0.2); }
  .sb-ico { font-size:1.6rem; }
  .sb-info { flex:1; min-width:0; }
  .sb-ttl { font-size:1.35rem; font-weight:800; font-variant-numeric:tabular-nums; }
  .sb-sub { font-size:0.85rem; color:var(--muted); margin-top:2px; line-height:1.35; }
  .sb-r { display:flex; gap:6px; }
  .sb-r button { padding:10px 14px; font-size:0.9rem; }

  /* ── 連線指示 ── */
  .conn { text-align:center; font-size:0.9rem; margin-bottom:10px; }
  .conn .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; vertical-align:middle; }
  .conn.ok .dot { background:var(--green); }
  .conn.bad .dot { background:var(--red); }

  /* ── 診斷列（broker / 設備）── */
  .diag { text-align:center; font-size:0.78rem; color:var(--muted); margin:-6px 0 12px;
    word-break:break-all; font-family:ui-monospace,SFMono-Regular,monospace; line-height:1.6; }

  /* ── 旋鈕 ── */
  .knob-wrap { position:relative; display:flex; justify-content:center; margin:6px 0; }
  .knob { width:100%; max-width:250px; cursor:grab; touch-action:none; user-select:none; }
  .knob:active { cursor:grabbing; }
  .k-track { fill:none; stroke:#1a2130; stroke-width:14; stroke-linecap:round;
    stroke-dasharray:452.39 603.19; transform:rotate(135deg); transform-origin:120px 120px; }
  .k-fill { fill:none; stroke:var(--accent); stroke-width:14; stroke-linecap:round;
    stroke-dasharray:0 603.19; transform:rotate(135deg); transform-origin:120px 120px;
    transition:stroke-dasharray 0.08s linear; filter:drop-shadow(0 0 6px rgba(59,130,246,0.5)); }
  .k-ptr { stroke:var(--text); stroke-width:3; stroke-linecap:round;
    transform-origin:120px 120px; transition:transform 0.08s linear; }
  .k-hub { fill:var(--panel); stroke:var(--border); stroke-width:1; }
  .knob-read { position:absolute; top:50%; left:50%; transform:translate(-50%,-46%);
    text-align:center; pointer-events:none; }
  .kr-val { font-size:2.9rem; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; }
  .kr-unit { font-size:0.9rem; color:var(--muted); margin-top:3px; }

  /* ── buttons ── */
  .row { display:flex; justify-content:center; gap:8px; margin:10px 0; }
  button { border:1px solid var(--border); background:var(--panel); color:var(--text);
    border-radius:8px; padding:12px 18px; font-size:1rem; cursor:pointer;
    transition:all 0.15s; font-family:inherit;
    box-shadow:0 2px 0 rgba(0,0,0,0.3), 0 4px 8px rgba(0,0,0,0.2); }
  button:hover { border-color:var(--accent); transform:translateY(-1px);
    box-shadow:0 3px 0 rgba(0,0,0,0.3), 0 6px 12px rgba(0,0,0,0.25); }
  button:active { transform:translateY(2px) scale(0.97);
    box-shadow:0 0px 0 rgba(0,0,0,0.3), 0 1px 3px rgba(0,0,0,0.15); }
  button.go { background:var(--green); color:#06240f; border-color:var(--green);
    font-size:1.2rem; padding:16px; font-weight:700;
    box-shadow:0 3px 0 #0d8a5e, 0 6px 16px rgba(16,185,129,0.3); }
  button.go:hover { border-color:#0d8a5e; box-shadow:0 4px 0 #0d8a5e, 0 8px 20px rgba(16,185,129,0.4); }
  button.go:active { transform:translateY(3px);
    box-shadow:0 0px 0 #0d8a5e, 0 2px 6px rgba(16,185,129,0.2); }
  button.stop { background:var(--red); color:#fff; border-color:var(--red);
    font-size:1.15rem; padding:16px; font-weight:700;
    box-shadow:0 3px 0 #b91c1c, 0 6px 16px rgba(239,68,68,0.3); }
  button.stop:hover { border-color:#f87171; box-shadow:0 4px 0 #b91c1c, 0 8px 24px rgba(239,68,68,0.5); }
  button.stop:active { transform:translateY(3px);
    box-shadow:0 0px 0 #b91c1c, 0 2px 6px rgba(239,68,68,0.2); }
  button.go:disabled, button.stop:disabled {
    opacity:0.35; cursor:not-allowed; transform:none;
    box-shadow:0 2px 0 rgba(0,0,0,0.2), 0 3px 6px rgba(0,0,0,0.1); }
  button.go:disabled:hover, button.stop:disabled:hover { border-color:inherit; }

  /* stop 按鈕跑的時候閃爍 */
  #gStop:not(:disabled) {
    animation: stopPulse 1.5s ease-in-out infinite;
  }
  @keyframes stopPulse {
    0%, 100% { box-shadow:0 3px 0 #b91c1c, 0 6px 16px rgba(239,68,68,0.3); }
    50% { box-shadow:0 3px 0 #b91c1c, 0 8px 28px rgba(239,68,68,0.6); }
  }

  .dur-row { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  button.dur { flex:1; min-width:58px; padding:11px 4px; font-size:0.95rem; }
  button.dur.active { background:var(--accent); color:#fff; border-color:var(--accent); }

  /* ── sliders ── */
  .set-label { font-size:0.92rem; color:var(--muted); margin-bottom:5px; display:block;
    line-height:1.4; }
  .set-row { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .set-row input[type=range] { flex:1; -webkit-appearance:none; height:6px;
    background:#1a2130; border-radius:3px; }
  .set-row input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:22px;
    height:22px; border-radius:50%; background:var(--accent); cursor:pointer; }
  .set-val { font-size:1rem; font-weight:700; min-width:40px; text-align:right;
    font-variant-numeric:tabular-nums; }

  .est { margin-top:10px; padding:10px; background:rgba(59,130,246,0.06); border-radius:6px;
    font-size:0.92rem; color:var(--muted); text-align:center; line-height:1.5; }

  /* ── progress ── */
  .prog { margin-top:10px; display:none; }
  .prog-bar { height:8px; background:#1a2130; border-radius:4px; overflow:hidden; }
  .prog-in { height:100%; width:0%; background:var(--green); transition:width 0.15s linear; }
  .prog-in.on { background:var(--red); }
  .prog-txt { text-align:center; font-size:0.95rem; color:var(--muted); margin-top:6px;
    font-variant-numeric:tabular-nums; }

  /* ── counter ── */
  .counter { text-align:center; font-size:0.95rem; color:var(--muted); margin-top:12px; }
  .wake { text-align:center; font-size:0.82rem; color:var(--orange); margin-top:6px; display:none; }

  /* ── mac ── */
  .mac-row { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .mac-row label { font-size:0.92rem; color:var(--muted); white-space:nowrap; }
  /* 輸入框一定要 >=16px，否則 iOS Safari 會在聚焦時自動放大整頁 */
  .mac-row input { flex:1; padding:11px 10px; background:#0d1219; border:1px solid var(--border);
    border-radius:6px; color:var(--text); font-size:1.05rem; font-family:monospace; text-align:center; }

  @media (max-width:400px) {
    body { padding:10px; }
    .card { padding:14px; }
    .knob { max-width:215px; }
    .kr-val { font-size:2.6rem; }
    button { padding:12px 14px; }
    button.dur { min-width:52px; font-size:0.9rem; }
  }
</style>
</head>
<body>

<div class="card">
  <h1>☕ 智能磨豆機</h1>
  <div class="sub">雲端版 · 開網頁就能控</div>

  <div class="mac-row">
    <label>設備</label>
    <input type="text" id="macInput" maxlength="12" autocomplete="off">
  </div>

  <div class="conn" id="conn">
    <span class="dot"></span><span id="connTxt">連線中…</span>
  </div>
  <div class="diag" id="brokerLine" style="display:none"></div>

  <!-- standby timer -->
  <div class="sb" id="sbPanel">
    <div class="sb-ico" id="sbIco">🌙</div>
    <div class="sb-info">
      <div class="sb-ttl" id="sbTtl">未待機</div>
      <div class="sb-sub" id="sbSub">按 ＋1 小時，時間到自動斷電</div>
    </div>
    <div class="sb-r">
      <button id="sbAdd">＋1 小時</button>
      <button id="sbOff" disabled class="stop" style="font-size:0.9rem;padding:10px 14px">下班</button>
    </div>
  </div>

  <!-- knob -->
  <div class="knob-wrap">
    <svg class="knob" id="knob" viewBox="0 0 240 240">
      <circle class="k-track" cx="120" cy="120" r="96"/>
      <circle class="k-fill" id="kFill" cx="120" cy="120" r="96"/>
      <g id="kTicks"></g>
      <line class="k-ptr" id="kPtr" x1="120" y1="120" x2="120" y2="42"/>
      <circle class="k-hub" cx="120" cy="120" r="58"/>
    </svg>
    <div class="knob-read">
      <div class="kr-val" id="kVal">4.0</div>
      <div class="kr-unit">秒 / 每次</div>
    </div>
  </div>

  <div class="row">
    <button id="kMinus">− 0.1</button>
    <button id="kPlus">+ 0.1</button>
  </div>

  <!-- loop settings -->
  <span class="set-label">間隔冷卻（秒）— 每次磨完停多久散熱</span>
  <div class="set-row">
    <input type="range" id="sOff" min="1" max="60" value="20" step="1">
    <span class="set-val" id="sOffV">20</span>
  </div>

  <span class="set-label">磨多久後自動停</span>
  <div class="dur-row">
    <button class="dur" data-m="0">一直磨</button>
    <button class="dur" data-m="1">1 分</button>
    <button class="dur active" data-m="5">5 分</button>
    <button class="dur" data-m="10">10 分</button>
    <button class="dur" data-m="30">30 分</button>
  </div>
  <div class="est" id="gEst">—</div>

  <!-- start / stop -->
  <div class="row" style="margin-top:12px">
    <button class="go" id="gStart" style="flex:1">▶ 開始磨</button>
    <button class="stop" id="gStop" disabled style="flex:0 0 112px">■ 停</button>
  </div>

  <!-- progress -->
  <div class="prog" id="gProg">
    <div class="prog-bar"><div class="prog-in" id="gBar"></div></div>
    <div class="prog-txt" id="gTxt">—</div>
  </div>

  <!-- 防鎖屏狀態 -->
  <div class="wake" id="wakeBadge"></div>

  <!-- counter -->
  <div class="counter" id="counter">本次已磨 0 次</div>
  <div style="text-align:center;margin-top:6px">
    <button id="cntReset" style="font-size:0.85rem;padding:9px 18px;border-color:var(--red);color:var(--red)">歸零</button>
  </div>
</div>

<script src="mqtt.min.js?v=7"></script>
<script>
const V = 'v9';      // 版本字串：只在 ?diag=1 時顯示，用來判斷瀏覽器是不是還吃著舊快取
const $ = s => document.querySelector(s);

// ── MQTT（Tasmota + HiveMQ Cloud，每租戶一組帳密）──
let client = null, connected = false, connGen = 0, devOnline = null;
let activeMac = '';  // 「目前這條連線」綁定的 MAC（理由見 renderStatus 的說明）

// 連線參數：URL ?mac=&host=&port=&scheme=&user=&pass=，MAC 另存 localStorage
//   有帶 host（客人連結）→ 用該 host（HiveMQ Cloud 走 wss 8884）
//   沒帶 host 且從 localhost 開啟 → 本機 broker（ws://<本機>:9001，測試用）
//   兩者皆無 → 直接報錯，不猜。以前會偷偷退回公開 broker，
//             結果畫面顯示「已連線」卻永遠控不到，這是最難查的假象。
const q = new URLSearchParams(location.search);
const _localHost = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
                   ? location.hostname : '';
const _hasHost = !!q.get('host');
const _useLocal = !_hasHost && _localHost;
const CFG = {
  host: q.get('host') || _localHost || '',
  port: q.get('port') || (_useLocal ? '9001' : '8884'),   // 本機 WebSocket = 9001，雲端 = 8884
  scheme: q.get('scheme') || (_useLocal ? 'ws' : 'wss'),  // 本機無 TLS = ws，雲端 = wss
  user: q.get('user') || '',
  pass: q.get('pass') || '',
};
const _macDefault = q.get('mac') || localStorage.getItem('clientMac') || '';
$('#macInput').value = _macDefault;
const BROKER_WS = CFG.host ? `${CFG.scheme}://${CFG.host}:${CFG.port}/mqtt` : '';
// ?diag=1 → 診斷列顯示完整技術資訊（broker 網址 / MAC / 版本）。
// 客人端預設不顯示，只有真的出問題才跳一行白話警告。
const DIAG = q.get('diag') === '1';

function getMac(){ return $('#macInput').value.trim().toLowerCase().replace(/:/g, '') || _macDefault; }
// Tasmota 統一慣例：device/cmnd/<mac>/POWER（指令）、device/stat/<mac>/POWER（狀態）
// ⚠️ 一律用 activeMac —— 也就是「這條連線實際訂閱的對象」，不是輸入框的即時值。
//    兩者一旦不一致，畫面就會「標籤寫 A、狀態其實是 B」，
//    於是出現「明明不在線卻顯示在線」這種鬼故事。
function cmdTopic(){ return 'device/cmnd/' + (activeMac || getMac()) + '/POWER'; }
function stateTopic(){ return 'device/stat/' + (activeMac || getMac()) + '/POWER'; }

// ── 狀態顯示 ──────────────────────────────────────────────
// ⚠️ 這裡以前只反映「瀏覽器有沒有連上 broker」，所以磨豆機明明不在線，
//    畫面照樣掛著「✅ 已連線」—— 客人一看就以為機器在線。
//    **broker 連上 ≠ 磨豆機在線**。現在唯一的指示燈一律只講「設備」。
let brokerUp = false, lastErr = '';

function renderStatus(){
  const mac = getMac();
  let txt, ok = false;
  if (typeof mqtt === 'undefined') txt = '❌ MQTT 程式庫沒載入';
  else if (!BROKER_WS)             txt = '⚠️ 網址不完整，請用完整的客人連結';
  else if (!mac)                   txt = '⚠️ 請先填設備 MAC（12 碼）';
  else if (mac.length !== 12)      txt = `⚠️ MAC 只有 ${mac.length} 碼（應為 12 碼）`;
  else if (!brokerUp)              txt = '❌ 沒連上伺服器 · 重試中…';
  else if (devOnline === null)     txt = '🔄 確認磨豆機中…';
  else if (devOnline === true)   { txt = '✅ 磨豆機在線'; ok = true; }
  else                             txt = '❌ 磨豆機沒回應';
  $('#connTxt').textContent = txt;
  $('#conn').className = 'conn ' + (ok ? 'ok' : 'bad');
  // 只有「設備確定回話」才算真的可以操作
  connected = brokerUp && devOnline === true;

  // 第二行：正常時完全不顯示（不給客人看技術字）；只有需要動作才給白話提示
  const el = $('#brokerLine');
  let msg = '';
  if (DIAG) {
    const shown = activeMac || mac || '(未填設備)';
    msg = (_useLocal ? '🧪 本機測試 · ' : '')
        + (BROKER_WS ? `${CFG.host}:${CFG.port} · ${shown}` : '沒有 broker')
        + ` · broker=${brokerUp ? 'up' : 'down'}`
        + ` · 設備=${devOnline === null ? '檢查中' : (devOnline ? '在線' : '沒回應')}`
        + (lastErr ? ` · err=${lastErr}` : '')
        + `　${V}`;
  } else if (devOnline === false) {
    msg = '⚠️ 磨豆機沒回應 —— 請確認插頭有電、Wi-Fi 正常';
  } else if (activeMac && mac && mac !== activeMac) {
    msg = `⚠️ 已改成 ${mac}，尚未連線`;
  }
  el.textContent = msg;
  el.style.display = msg ? 'block' : 'none';
}

function connect(){
  const m = getMac();

  // 世代編號：舊連線的事件不准再動到新連線。
  // （舊版是舊 client 的 close 去 client.end() 掉新 client → 自己咬自己，永遠連不上）
  const my = ++connGen;
  if (client) { try { client.end(true); } catch (e) {} client = null; }
  brokerUp = false; devOnline = null; activeMac = ''; lastErr = '';

  // 參數不合法就別連，但畫面要正確反映原因
  if (!m || m.length !== 12 || typeof mqtt === 'undefined' || !BROKER_WS) { renderStatus(); return; }

  activeMac = m;         // 這條連線綁定的設備 —— 顯示與指令都用它
  let devLive = false;   // 這次連線有沒有真的收到設備的回應（每個世代各自算）

  renderStatus();
  const opts = {
    clientId: 'c_' + m + '_' + Math.random().toString(16).slice(2, 10),
    reconnectPeriod: 3000,   // 重連交給 mqtt.js 自己處理，不再手動 recursive connect
    connectTimeout: 10000,
    clean: true,
  };
  if (CFG.user) { opts.username = CFG.user; opts.password = CFG.pass; }   // HiveMQ Cloud 帳密

  const c = mqtt.connect(BROKER_WS, opts);
  client = c;

  c.on('connect', () => {
    if (my !== connGen) return;
    brokerUp = true;
    renderStatus();   // 這時只知道 broker 通了，設備還在確認 → 顯示「🔄 確認磨豆機中…」
    // ── 判斷設備到底在不在 ──────────────────────────────
    // 千萬不可以只信 `tele/<mac>/LWT`：那是 retained 訊息，等於「上次留下的便條」。
    // 插頭被拔掉、換網路、或根本沒在這台 broker 上，那個 Online 還是會一直躺在那裡
    // → 畫面就會出現「明明不在線卻顯示在線」。
    // 唯一可信的證據是 **設備真的回話**。所以主動問一次 State（純查詢，不會動繼電器），
    // 收到任何 stat/tele 回應才算在線；逾時沒回應就是不在。
    // ⚠️ 探測一定要等 subscribe 的回呼才送：訂閱是非同步的，
    //    先送再訂會漏掉設備的回應 → 明明在線卻被判成「沒回應」。
    c.subscribe([stateTopic(), 'device/stat/' + m + '/RESULT',
                 'device/tele/' + m + '/LWT', 'device/tele/' + m + '/STATE'],
      (err) => {
        if (my !== connGen || err) return;
        c.publish('device/cmnd/' + m + '/State', '');
      });
    setTimeout(() => {
      if (my !== connGen || !brokerUp || devLive) return;
      devOnline = false; renderStatus();
    }, 6000);
  });
  c.on('message', (topic, msg) => {
    if (my !== connGen) return;
    const t = topic.toLowerCase(), s = msg.toString().trim();
    if (t.endsWith('/lwt')) {
      // Offline 可以直接信；Online 不算數 —— 要等設備真的回話（見上面）
      if (s.toLowerCase() === 'offline') { devOnline = false; devLive = false; renderStatus(); }
      return;
    }
    // 設備真的有回應了
    if (t.endsWith('/result') || t.endsWith('/state') || t.endsWith('/power')) {
      devLive = true;
      if (devOnline !== true) { devOnline = true; renderStatus(); }
      // 插頭實際狀態 → 驅動磨豆進度（伺服器在跑循環，客人端只觀察、不發指令）
      if (t.endsWith('/power')) {
        onRelayState(s.toUpperCase());
      } else if (t.endsWith('/state')) {
        try { const j = JSON.parse(s); if (j && j.POWER) onRelayState(String(j.POWER).toUpperCase()); } catch(e){}
      }
    }
  });
  // 只更新畫面，絕不在這裡再呼叫 connect()
  c.on('reconnect', () => { if (my === connGen) { brokerUp = false; renderStatus(); } });
  c.on('offline',   () => { if (my === connGen) { brokerUp = false; renderStatus(); } });
  c.on('close',     () => { if (my === connGen) { brokerUp = false; renderStatus(); } });
  c.on('error', (e) => {
    if (my !== connGen) return;
    brokerUp = false; devOnline = null;
    lastErr = (e && e.message) ? String(e.message).slice(0, 60) : '連線失敗';
    renderStatus();
  });
}
connect();

$('#macInput').onchange = () => { localStorage.setItem('clientMac', getMac()); connect(); };

// ── 旋鈕 1.0–9.9 ──
const K_MIN=1.0, K_MAX=9.9, K_ARC=270, K_R=96, K_C=2*Math.PI*K_R, K_ARC_LEN=K_C*K_ARC/360;
let kv = 4.0;

(function ticks(){
  let h='';
  for(let s=1;s<=9;s++){
    const a=(135+(s-K_MIN)/(K_MAX-K_MIN)*K_ARC)*Math.PI/180;
    const [c,si]=[Math.cos(a),Math.sin(a)];
    h+=`<line class="k-tick maj" x1="${120+c*80}" y1="${120+si*80}" x2="${120+c*72}" y2="${120+si*72}"/>`;
    h+=`<text class="k-lbl" x="${120+c*66}" y="${120+si*66+4}">${s}</text>`;
  }
  $('#kTicks').innerHTML = h;
})();

function kRender(){
  const f=(kv-K_MIN)/(K_MAX-K_MIN);
  $('#kFill').style.strokeDasharray=`${K_ARC_LEN*f} ${K_C}`;
  $('#kFill').style.stroke=kv>=7?'var(--orange)':kv<=2?'var(--cyan)':'var(--accent)';
  $('#kPtr').style.transform=`rotate(${135+f*K_ARC+90}deg)`;
  $('#kVal').textContent=kv.toFixed(1);
  estimate();
}
function kSet(v){ kv=Math.min(K_MAX,Math.max(K_MIN,Math.round(v*10)/10)); kRender(); }
$('#kPlus').onclick=()=>kSet(kv+0.1);
$('#kMinus').onclick=()=>kSet(kv-0.1);

let dragging=false;
function fromPoint(e){
  const r=$('#knob').getBoundingClientRect();
  const p=e.touches?e.touches[0]:e;
  let deg=Math.atan2(p.clientY-(r.top+r.height/2),p.clientX-(r.left+r.width/2))*180/Math.PI;
  deg=(deg-135+360)%360; if(deg>K_ARC)return;
  kSet(K_MIN+deg/K_ARC*(K_MAX-K_MIN));
}
$('#knob').addEventListener('pointerdown',e=>{dragging=true;$('#knob').setPointerCapture(e.pointerId);fromPoint(e);});
$('#knob').addEventListener('pointermove',e=>dragging&&fromPoint(e));
$('#knob').addEventListener('pointerup',()=>dragging=false);
$('#knob').addEventListener('wheel',e=>{e.preventDefault();kSet(kv+(e.deltaY<0?0.1:-0.1));},{passive:false});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowUp'){e.preventDefault();kSet(kv+0.1);}
  if(e.key==='ArrowLeft'||e.key==='ArrowDown'){e.preventDefault();kSet(kv-0.1);}
});

// ── 循環設定 ──
let grindMins = 5;
function estimate(){
  const off=+$('#sOff').value; $('#sOffV').textContent=off;
  if(grindMins===0) $('#gEst').innerHTML=`一直磨到你按停 · 每圈 <b style="color:var(--text)">${kv.toFixed(1)}s 磨 + ${off}s 停</b>`;
  else {
    const cyc=Math.max(1,Math.round(grindMins*60/(kv+off)));
    $('#gEst').innerHTML=`磨 <b style="color:var(--text)">${grindMins} 分鐘</b> · 約 <b style="color:var(--text)">${cyc}</b> 圈`;
  }
}
$('#sOff').oninput=()=>estimate();
document.querySelectorAll('.dur').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.dur').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); grindMins=+b.dataset.m; estimate();
});

// ── 待機 timer（+1小時，上限5hr） ──
let standbyUntil = null, sbInterval = null;
function hms(s){ const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  return h?`${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`:`${m}:${String(x).padStart(2,'0')}`; }
function sbRender(){
  const left = standbyUntil ? Math.max(0, Math.round(standbyUntil - Date.now()/1000)) : 0;
  if(left <= 0 && standbyUntil){ standbyUntil = null; sbRender(); return; }
  const p = $('#sbPanel'), armed = standbyUntil !== null;
  $('#sbOff').disabled = !armed;
  if(!armed){
    p.className='sb'; $('#sbIco').textContent='🌙';
    $('#sbTtl').textContent='未待機'; $('#sbSub').textContent='按 ＋1 小時，時間到自動斷電';
    $('#sbAdd').disabled = false;
    return;
  }
  const low = left < 300;
  p.className='sb'+(low?' low':'');
  $('#sbIco').textContent=low?'⏰':'☀️'; $('#sbTtl').textContent=hms(left);
  $('#sbSub').textContent=low?'快到了 － 要加班再按 ＋1 小時':'待機中 · 時間到自動斷電';
  $('#sbAdd').disabled = left >= 5*3600; // 上限5小時
}
$('#sbAdd').onclick=()=>{
  const base = standbyUntil || Date.now()/1000;
  standbyUntil = Math.min(base + 3600, Date.now()/1000 + 5*3600);
  sbRender();
  if(!sbInterval) sbInterval = setInterval(sbRender, 1000);
};
$('#sbOff').onclick=()=>{
  if(!confirm('結束待機並斷電？')) return;
  standbyUntil = null; send(0); sbRender();
};
sbRender();

// ── 開始 / 停止 ──
let grinding=false, stopFlag=false, grindCount=0, grindTimer=null, safetyTimer=null, _relayState=0;

// ── 防鎖屏（Wake Lock API）──
// 手機鎖屏 → 瀏覽器凍結 JS 計時器、切斷 WebSocket → 磨豆循環會中斷。
// 磨豆期間請求 wake lock 讓螢幕不自動關；停止時釋放，不浪費電。
// ⚠️ 只防「螢幕自動關」。使用者手動按電源鍵鎖屏／切到別的 App → 系統會釋放，仍會停。
let wakeLock=null;
async function keepAwake(on){
  const badge=document.getElementById('wakeBadge');
  if(!('wakeLock' in navigator)){
    if(badge){ badge.style.display=on?'block':'none'; badge.textContent=on?'⚠️ 此瀏覽器不支援防鎖屏，請手動關閉自動鎖定':''; }
    return;
  }
  try{
    if(on && !wakeLock){
      wakeLock=await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release',()=>{ wakeLock=null; });
      if(badge){ badge.style.display='block'; badge.textContent='🔆 磨豆中，螢幕保持喚醒'; }
    }else if(!on && wakeLock){
      await wakeLock.release(); wakeLock=null;
      if(badge){ badge.style.display='none'; badge.textContent=''; }
    }
  }catch(e){
    if(badge){ badge.style.display='block'; badge.textContent='⚠️ 無法防鎖屏：'+(e.message||e.name); }
  }
}
// 頁面被切走時系統會自動釋放 wake lock；回到前景要重新取得
document.addEventListener('visibilitychange',()=>{ if(grinding && document.visibilityState==='visible') keepAwake(true); });

$('#counter').textContent = '本次已磨 0 次';

function send(key){
  // ⚠️ 這裡只要求「broker 連著」，不看設備在不在：
  //    OFF（停機）指令絕對不能被狀態判斷擋掉，那會變成人命問題。
  //    設備真的失聯時，插頭自己的 PulseTime 看門狗會在 11 秒後斷電。
  if(!client||!brokerUp) return;
  client.publish(cmdTopic(), key ? 'ON' : 'OFF');   // Tasmota POWER 指令
}
function clearTimers(){
  clearTimeout(grindTimer); clearTimeout(safetyTimer);
  grindTimer=null; safetyTimer=null;
}

// ── 磨豆：指令送伺服器，循環由伺服器跑 ──────────────────────
// 為什麼：手機一鎖屏，瀏覽器的 JS 計時器會被凍結、WebSocket 被切斷，
//   磨豆會在磨到一半停掉。所以「循環改由伺服器（Mac mini，24h 常駐）執行」：
//   客人端只負責 ①送 start/stop ②觀察插頭實際狀態來顯示進度。
//   手機鎖屏、切 App、關機、沒電 → 磨豆照跑（插頭 PulseTime 看門狗仍是最後保險）。
function grindTopic(){ return 'device/grind/' + (activeMac || getMac()) + '/cmd'; }
function grindCmd(action, extra){
  if(!client||!brokerUp) return false;
  client.publish(grindTopic(), JSON.stringify(Object.assign({action:action}, extra||{})));
  return true;
}
let srvWaitTimer=null, phaseEndsAt=0, phaseKind='', cycleNo=0, curOn=4, curOff=20;

$('#gStart').onclick=()=>{
  if(grinding) return;
  if(!connected) return alert(devOnline === false
    ? '磨豆機沒回應 —— 請確認插頭有電、Wi-Fi 正常'
    : '還沒連上，請稍候');
  stopFlag=false; grinding=true; cycleNo=0;
  keepAwake(true);                                  // 🔆 磨豆期間螢幕不自動關
  $('#gStart').disabled=true; $('#gStop').disabled=false;
  $('#gProg').style.display='block';
  $('#gBar').style.width='0%';
  $('#gTxt').textContent='⏳ 已送指令，等伺服器接手…';

  curOn = kv;
  curOff = +$('#sOff').value;
  grindCmd('start', {on:curOn, off:curOff, minutes:grindMins});

  // 伺服器沒接手（6 秒內插頭完全沒動作）→ 明確告知，不讓客人乾等
  clearTimeout(srvWaitTimer);
  srvWaitTimer=setTimeout(()=>{
    if(grinding && cycleNo===0){
      $('#gTxt').textContent='⚠️ 伺服器沒回應 —— 磨豆未啟動（請確認 Mac mini 開著）';
    }
  }, 6000);
};

// 觀察插頭「實際」狀態 → 驅動畫面（客人端不再自己發 ON/OFF）
function onRelayState(relay){
  if(!grinding) return;
  clearTimeout(srvWaitTimer);
  if(relay==='ON'){
    cycleNo++; grindCount++;
    $('#counter').textContent='本次已磨 '+grindCount+' 次';
    phaseKind='on'; phaseEndsAt=Date.now()+curOn*1000;
  }else{
    phaseKind='off'; phaseEndsAt=Date.now()+curOff*1000;
  }
  tick();
}
function tick(){
  if(!grinding) return;
  const dur  = phaseKind==='on' ? curOn : curOff;
  const left = Math.max(0,(phaseEndsAt-Date.now())/1000);
  $('#gBar').style.width = Math.min(100,(1-left/Math.max(dur,0.1))*100)+'%';
  $('#gBar').className='prog-in'+(phaseKind==='on'?' on':'');
  $('#gTxt').textContent = phaseKind==='on'
    ? '🔴 第 '+cycleNo+' 圈 · 磨 '+left.toFixed(1)+'s'
    : '🔵 冷卻 '+Math.ceil(left)+'s…';
  grindTimer=setTimeout(tick,100);
}
function finishGrind(){
  grinding=false; clearTimers(); clearTimeout(srvWaitTimer); keepAwake(false);
  $('#gStart').disabled=false; $('#gStop').disabled=true;
  $('#gProg').style.display='none';
}

// 停止（也給待機到期共用）：叫伺服器停，自己也直接送 OFF（雙保險，絕不讓它卡在 ON）
function stopAll(){
  stopFlag=true;
  grindCmd('stop');                 // 伺服器收到就收工，並保證送 OFF
  grinding=false;
  clearTimers(); clearTimeout(srvWaitTimer); keepAwake(false);
  send(0);
  // 三重 OFF（0 / 0.3s / 1.2s）：蓋掉「ON 正在飛」或交界處競態
  setTimeout(()=>{ if(!grinding) send(0); }, 300);
  setTimeout(()=>{ if(!grinding) send(0); }, 1200);
  $('#gStart').disabled=false; $('#gStop').disabled=true;
  $('#gProg').style.display='none';
}

$('#gStop').onclick=stopAll;
$('#cntReset').onclick=()=>{
  if(!confirm('歸零計數器？\n\n累計 ' + grindCount + ' 次')) return;
  grindCount=0;
  $('#counter').textContent='本次已磨 0 次';
};

// ── 待機到期：強制停 ──
setInterval(()=>{
  if(standbyUntil && Date.now()/1000 >= standbyUntil){
    standbyUntil=null;
    stopAll();          // 待機到期：擋迴圈 + 雙重 OFF
    sbRender();
  }
}, 1000);

setInterval(()=>{ if(standbyUntil) sbRender(); }, 1000);

kRender(); estimate();
</script>
</body>
</html>
